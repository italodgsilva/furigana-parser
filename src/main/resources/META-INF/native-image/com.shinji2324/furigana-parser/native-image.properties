# Argumentos aplicados automaticamente pelo GraalVM Native Image.
#
# As configuracoes de reflexao, recursos, JNI e proxy ficam ao lado deste
# arquivo (reflect-config.json, resource-config.json, jni-config.json,
# proxy-config.json). Elas foram obtidas com o tracing agent do native-image
# executando a aplicacao nas rotas JSON, ASS + subset e --help.
#
# --no-fallback: falha a compilacao se faltar configuracao, em vez de gerar
#                um binario que so funciona no modo JVM.
Args = --no-fallback -H:+ReportExceptionStackTraces
