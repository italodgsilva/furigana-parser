# Publishes a version of the program.
#
# When a `v*` tag is pushed, builds the executable JARs (CLI and GUI) and attaches them to a GitHub Release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  jar:
    name: JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile, test and package
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Rename the JARs with the tag version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "$(ls target/furigana-parser-[0-9]*.jar | grep -v -- '-gui\.jar$' | head -n1)" \
             "furigana-parser-${version}.jar"
          cp "$(ls target/furigana-parser-[0-9]*-gui.jar | head -n1)" \
             "furigana-parser-gui-${version}.jar"

      - name: Create/update the Release and attach the files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" furigana-parser-*.jar --clobber
